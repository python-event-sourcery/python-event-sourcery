[project]
name = "python-event-sourcery"
version = "0.5.3a3"
requires-python = ">=3.10"
description = "A library for event-based systems in Python."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sebastian Buczyński", email = "nnplaya@gmail.com" },
    { name = "Łukasz Żukowski", email = "lukasz.zukowski@gmail.com" },
]
dependencies = [
    "pydantic>=2.0,<3",
    "more-itertools",
    "psycopg2-binary>2,<3",
]

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=2.0"]
kurrentdb = ["kurrentdbclient>=1.0.6"]
django = ["django>=4,<6"]

[dependency-groups]
dev = [
    "ruff==0.10.0",
    "mypy==1.15.0",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "zensical>=0.0.11",
    "mkdocstrings[python]>=1.0.6",
    "time-machine",
    "pika",
    "deepdiff",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "not_implemented: skip not implemented yet backend functionality",
    "skip_backend: skip features not supported by backend",
]
DJANGO_SETTINGS_MODULE = "tests.backend.django"

[tool.coverage.run]
branch = true
source = [
    "event_sourcery",
    "event_sourcery_django",
    "event_sourcery_kurrentdb",
    "event_sourcery_sqlalchemy",
]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "pass",
    "\\.\\.\\.",
    "NotImplementedError",
    "__repr__",
    "__str__",
    "TYPE_CHECKING",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
line-length = 88
show-fixes = true
exclude = ["**/migrations"]

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "C",  # Convention
    "E",  # Error
    "F",  # Pyflakes
    "G",  # flake8-logging-format
    "I",  # isort
    "N",  # pep8-naming
    "Q",  # flake8-quotes
    "S",  # flake8-bandit
    "W",  # Warning
    "PL",  # Pylint
    "UP",  # pyupgrade
    "RUF",  # Ruff-specific rules
]
ignore = [
    "N818",  # error-suffix-on-exception-name
    "PLR2004",  # magic-value-comparison
    "E501",  # line-too-long, ruff format takes care about it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # Use of assert detected
    "PLW1641",  # Object does not implement `__hash__` method
]
"event_sourcery_django/models.py" = [
    "RUF012",  # Mutable class attributes should be annotated with typing.ClassVar
]
"event_sourcery_django/__init__.py" = [
    "PLC0415",  # Lazy imports to avoid Django app loading issues
]
"event_sourcery_sqlalchemy/models/base.py" = [
    "PLW1641",  # Object does not implement `__hash__` method
]
"docs/code/*" = [
   "S101",  # Use of assert detected
   "N806",  # Variables in function should be lowercase
   "B018",  # Useless expressions
   "PLC0415",  # Imports inside functions for docs snippets
   "PLW0108",  # Lambda may be unnecessary
]

[tool.ruff.lint.pylint]
max-args = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "event_sourcery",
    "event_sourcery_django",
    "event_sourcery_kurrentdb",
    "event_sourcery_sqlalchemy",
]
