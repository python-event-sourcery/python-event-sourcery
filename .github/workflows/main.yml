name: Lint & tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: es
          POSTGRES_PASSWORD: es
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      eventstoredb:
        image: eventstore/eventstore:latest
        env:
          EVENTSTORE_MEM_DB: True
          EVENTSTORE_CLUSTER_SIZE: 1
          EVENTSTORE_RUN_PROJECTIONS: All
          EVENTSTORE_START_STANDARD_PROJECTIONS: true
          EVENTSTORE_INSECURE: true
          EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: true
        ports:
          - 1113:1113
          - 2113:2113

      rabbitmq:
        image: rabbitmq:3.11.2
        ports:
          - '5672:5672'
          - '15672:15672'

    steps:
    - uses: actions/checkout@v2
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install poe
      run: uv tool install poethepoet
    - name: Install deps
      run: uv sync --all-extras
    - name: Run linters
      run: poe lint-fix
    - name: Build docs
      run: uv run --all-extras zensical build --clean
    - name: Test docs code snippets
      run: poe docs-test
    - name: Test with pytest
      run: poe test
